<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSB Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>VSB Engineering College</h1>
    <h2>Election Administration Panel</h2>

    <div class="card">

        <h3>Admin Login</h3>

        <input type="text" id="adminUsername" placeholder="Username">

        <input type="password" id="adminPassword" placeholder="Password">

        <button onclick="adminLogin()">Login</button>

    </div>

    <div id="adminDashboard" style="display:none;">

        <h2>Election Control Panel</h2>

        <h3>Upload Student CSV</h3>

<input type="file" id="csvFile" accept=".csv">

<button type="button" onclick="uploadCSV()">
    Upload CSV
</button>

        <h3>Search Candidate</h3>
        
        <button type="button" onclick="loadCandidateForEdit()">
        Load Candidate Details
    </button>



        <input type="text" id="searchCandidateId" placeholder="Enter Candidate ID">
        
        <button type="button" onclick="searchCandidate()">
            
        Search
        
        </button>

        <h3>Add New Candidate</h3>

        <input type="text" id="candidateId" placeholder="Candidate ID">

        <input type="text" id="candidateName" placeholder="Candidate Name">

        <input type="text" id="candidateDegree" placeholder="Degree">

        <input type="text" id="candidateQualification" placeholder="Qualification">

        <textarea id="candidateManifesto" placeholder="Manifesto"></textarea>

        <select id="candidatePosition">
            <option>President</option>
            <option>Vice President</option>
            <option>General Secretary</option>
        </select>

       <button type="button" onclick="addCandidate()">Save Candidate</button>

       <button type="button" onclick="updateCandidate()">Update Candidate</button>
       
       <button type="button" onclick="deleteCandidate()">Delete Candidate</button>
       
       <button type="button" onclick="startElection()">Start Election</button>
       
       <button type="button" onclick="stopElection()">Stop Election</button>
       
       <button type="button" onclick="viewResults()">View Results</button>
       
<button type="button" onclick="viewWinners()">
    🏆 View Winners
</button>

       <button type="button" onclick="adminLogout()">Logout</button>

    </div>

</div>

<script>
    function adminLogin(){

    let username = document.getElementById("adminUsername").value;
    let password = document.getElementById("adminPassword").value;

    if(username === "admin" && password === "admin@vsb2026"){

        document.querySelector(".card").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";

        alert("Welcome Admin");

    }else{

        alert("Invalid Admin Credentials");

    }

}


async function addCandidate(){

    const data = {

        candidateId: document.getElementById("candidateId").value,
        password: "123456",
        name: document.getElementById("candidateName").value,
        degree: document.getElementById("candidateDegree").value,
        qualification: document.getElementById("candidateQualification").value,
        achievements: "New Candidate",
        manifesto: document.getElementById("candidateManifesto").value,
        position: document.getElementById("candidatePosition").value

    };

    try{

        const response = await fetch("http://127.0.0.1:8000/api/admin/add-candidate",{

            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(data)

        });

        const result = await response.json();

        if(response.ok){

            alert(result.message);

            document.getElementById("candidateId").value = "";
document.getElementById("candidateName").value = "";
document.getElementById("candidateDegree").value = "";
document.getElementById("candidateQualification").value = "";
document.getElementById("candidateManifesto").value = "";
document.getElementById("candidatePosition").selectedIndex = 0;

        }else{

            alert(result.detail);

        }

    }catch(error){

        alert("Backend connection failed");
        console.log(error);

    }

}


async function deleteCandidate(){

    const candidateId = prompt("Enter Candidate ID");

    if(!candidateId) return;

    try{

        const response = await fetch("http://127.0.0.1:8000/api/admin/delete-candidate",{

            method:"DELETE",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                candidateId:candidateId
            })

        });

        const result = await response.json();

        if(response.ok){

            alert(result.message);

        }else{

            alert(result.detail);

        }

    }catch(error){

        alert("Backend connection failed");
        console.log(error);

    }

}
async function startElection(){

    try{

        const response = await fetch("http://127.0.0.1:8000/api/admin/start-election",{
            method:"POST"
        });

        const result = await response.json();

        alert(result.message);

    }catch(error){

        alert("Backend connection failed");
        console.log(error);

    }

}


async function stopElection(){

    try{

        const response = await fetch("http://127.0.0.1:8000/api/admin/stop-election",{
            method:"POST"
        });

        const result = await response.json();

        alert(result.message);

    }catch(error){

        alert("Backend connection failed");
        console.log(error);

    }

}

async function updateCandidate(){

    const data = {

        candidateId: document.getElementById("candidateId").value,
        name: document.getElementById("candidateName").value,
        degree: document.getElementById("candidateDegree").value,
        qualification: document.getElementById("candidateQualification").value,
        manifesto: document.getElementById("candidateManifesto").value,
        position: document.getElementById("candidatePosition").value

    };

    try{

        const response = await fetch(
            "http://127.0.0.1:8000/api/admin/update-candidate",
            {
                method:"PUT",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(data)
            }
        );

        const result = await response.json();

        if(response.ok){

            alert(result.message);

        }else{

            alert(result.detail);

        }

    }catch(error){

        alert("Backend connection failed");
        console.log(error);

    }

}
function viewResults(){

    window.open("http://127.0.0.1:8000/docs#/default/get_results_api_results_get","_blank");

}

async function viewWinners(){

    try{

        const response = await fetch(
            "http://127.0.0.1:8000/api/admin/winners"
        );

        const result = await response.json();

        if(response.ok && result.success){

            let message = "🏆 WINNERS\n\n";

            result.winners.forEach(w => {

                message +=
                    "Position : " + w.position +
                    "\nWinner : " + w.name +
                    "\nDegree : " + w.degree +
                    "\nVotes : " + w.vote_count +
                    "\n\n";

            });

            alert(message);

        }else{

            alert("No winners found.");

        }

    }catch(error){

        alert("Backend connection failed.");
        console.log(error);

    }

}

function adminLogout(){

    document.querySelector(".card").style.display = "block";
    document.getElementById("adminDashboard").style.display = "none";

    document.getElementById("adminUsername").value = "";
    document.getElementById("adminPassword").value = "";

    alert("Logged out successfully");

}

async function searchCandidate(){

    const candidateId = document.getElementById("searchCandidateId").value.trim();

    if(candidateId === ""){
        alert("Enter Candidate ID");
        return;
    }

    try{

        const response = await fetch(
            "http://127.0.0.1:8000/api/candidate/profile/" + candidateId
        );

        const result = await response.json();

        if(response.ok && result.success){

            const c = result.candidate;

            alert(
                "Name : " + c.name +
                "\nPosition : " + c.position +
                "\nDegree : " + c.degree
            );

        }else{

            alert("Candidate not found");

        }

    }catch(error){

        alert("Backend connection failed");
        console.log(error);

    }

}

async function loadCandidateForEdit(){

    const candidateId = document.getElementById("searchCandidateId").value.trim();

    if(candidateId === ""){
        alert("Enter Candidate ID");
        return;
    }

    try{

        const response = await fetch(
            "http://127.0.0.1:8000/api/candidate/profile/" + candidateId
        );

        const result = await response.json();

        if(response.ok && result.success){

            const c = result.candidate;

            document.getElementById("candidateId").value = c.candidate_id;
            document.getElementById("candidateName").value = c.name;
            document.getElementById("candidateDegree").value = c.degree;
            document.getElementById("candidateQualification").value = c.qualification;
            document.getElementById("candidateManifesto").value = c.manifesto;
            document.getElementById("candidatePosition").value = c.position;

            alert("Candidate details loaded.");

        }else{

            alert("Candidate not found.");

        }

    }catch(error){

        alert("Backend connection failed");
        console.log(error);

    }

}

async function uploadCSV(){

    const file = document.getElementById("csvFile").files[0];

    if(!file){
        alert("Please select a CSV file.");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    try{

        const response = await fetch(
            "http://127.0.0.1:8000/api/admin/upload-students",
            {
                method:"POST",
                body:formData
            }
        );

        const result = await response.json();

        if(response.ok){

            alert(result.message);
            document.getElementById("csvFile").value = "";

        }else{

            alert(result.detail);

        }

    }catch(error){

        alert("Backend connection failed");
        console.log(error);

    }

}

</script>

</body>
</html>
