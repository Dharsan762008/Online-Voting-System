<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secured Digital Voting System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Background Orbs for Rich Visual Depth -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Main Application Container -->
  <div class="container">

    <!-- App Header & Brand -->
    <h1>
      <!-- SVG Secure Checkmark Voting Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="50%" stop-color="#4facfe" />
            <stop offset="100%" stop-color="#7f5af0" />
          </linearGradient>
        </defs>
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 11 2 2 4-4"/>
      </svg>
      VOTEGUARD SYSTEM
    </h1>

    <!-- Navigation Menu (Using SVGs + Labels for Premium Look) -->
    <div class="menu">
      <button class="active" onclick="showSection('candidate')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" x2="19" y1="8" y2="14"/>
          <line x1="22" x2="16" y1="11" y2="11"/>
        </svg>
        Candidate Reg.
      </button>
      <button onclick="showSection('voter')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Voter Login
      </button>
      <button onclick="showSection('admin')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
          <line x1="9" x2="15" y1="9" y2="9"/>
          <line x1="9" x2="15" y1="13" y2="13"/>
          <line x1="9" x2="13" y1="17" y2="17"/>
        </svg>
        Admin Panel
      </button>
      <button onclick="showSection('results')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" x2="18" y1="20" y2="10"/>
          <line x1="12" x2="12" y1="20" y2="4"/>
          <line x1="6" x2="6" y1="20" y2="14"/>
        </svg>
        Results
      </button>
    </div>

    <!-- Candidate Registration Section -->
    <div id="candidate" class="section active">
      <h2>Candidate Registration</h2>
      <div class="candidate-form-grid">
        <input type="text" id="candidateId" placeholder="Candidate ID (e.g. C-101)">
        <input type="text" id="candidateName" placeholder="Full Name">
        <input type="text" id="party" placeholder="Political Party Affiliation">
        <input type="number" id="age" placeholder="Age (Minimum 18)">
        <input type="text" id="constituency" placeholder="Voting Constituency" class="full-width">
        <textarea id="property" placeholder="Financial Asset & Property Details (for Transparency Public Ledger)" class="full-width"></textarea>
        <textarea id="manifesto" placeholder="Manifesto & Key Campaign Commitments" class="full-width"></textarea>
      </div>
      <button class="btn-primary" onclick="registerCandidate()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Register Candidate
      </button>
    </div>

    <!-- Voter Dashboard Section -->
    <div id="voter" class="section">
      <h2>Voter Dashboard</h2>
      <div class="voter-login-box">
        <input type="text" id="voterId" placeholder="Enter voter ID (e.g. V-202) to verify ballot access">
        <button class="btn-primary" onclick="loadCandidates()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          Load Candidates
        </button>
      </div>
      <div id="candidateList"></div>
    </div>

    <!-- Admin Panel Section -->
    <div id="admin" class="section">
      <h2>Admin Dashboard</h2>
      <div class="admin-stats-grid">
        <div class="stat-card">
          <div class="stat-label">Registered Candidates</div>
          <div class="stat-value"><span id="totalCandidates">0</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Votes Cast</div>
          <div class="stat-value"><span id="totalVotes">0</span></div>
        </div>
      </div>
      <button class="btn-primary" onclick="refreshAdmin()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        Refresh Dashboard
      </button>
    </div>

    <!-- Results Section -->
    <div id="results" class="section">
      <h2>Election Results</h2>
      <div id="resultList"></div>
      <button class="btn-primary" onclick="showResults()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" x2="18" y1="20" y2="10"/>
          <line x1="12" x2="12" y1="20" y2="4"/>
          <line x1="6" x2="6" y1="20" y2="14"/>
        </svg>
        Show Results
      </button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
